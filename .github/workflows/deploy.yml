name: Deploy NestJS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "$HOME/server"
            # npm install can rewrite package-lock.json on the droplet, which makes
            # `git pull` abort. Always match origin exactly (untracked files like .env are kept).
            git fetch origin main
            git reset --hard origin/main
            npm install
            npx prisma generate
            npx prisma migrate deploy
            export NODE_OPTIONS="--max-old-space-size=512"
            npm run build
            pm2 restart nest-backend --update-env